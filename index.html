    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('websocket') || e.message?.includes('WebSocket') || e.target instanceof WebSocket)) {
          e.stopImmediatePropagation?.();
          e.preventDefault?.();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('websocket') || String(e.reason).includes('WebSocket'))) {
          e.stopImmediatePropagation?.();
          e.preventDefault?.();
        }
      });
    </script>
